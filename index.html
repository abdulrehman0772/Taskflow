
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow</title>

   
    <link rel="stylesheet" href="style.css">

    

</head>

<body>

    <div class="page-container">

        
        <header class="logo">
            <div class="logo-icon">✓</div>
            <span>TaskFlow</span>
        </header>

        <main class="main-content">

            <section class="hero">

                <h1>
                    Get your day<br>
                    in order.
                </h1>

                <p class="description">
                    Write it down, tick it off, and pick up right where you left off.
                </p>

                
                <div class="task-list">

                    <div class="task completed">
                        <input type="checkbox" >
                        <span>Plan the week</span>
                    </div>

                    <div class="task completed">
                        <input type="checkbox" >
                        <span>Style the login page</span>
                    </div>

                    <div class="task">
                        <input type="checkbox">
                        <span>Connect json-server</span>
                    </div>

                </div>

            </section>

        </main>

        
        <footer class="footer">
            Studio93 intern program
        </footer>

    </div>

</body>
</html>
