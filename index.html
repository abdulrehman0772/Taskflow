<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>TaskFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@700&display=swap"
      rel="stylesheet">

    <link rel="stylesheet" href="./stylesheets/style.css">

    

</head>

<body>

    

       <div class="page-container">
      
 
        <main class="main-content">

              <header class="logo">
            <div><img src="C:\Users\HUSSNAIN.COM\taskflow\images\Mark.png" alt=""></div>
            <span>TaskFlow</span>
        </header>

            <section class="hero">

                <h1>
                    Get your day<br>
                    in order.
                </h1>

                <p class="description">
                    Write it down, tick it off, and pick up right where you<br> left off.
                </p>

                
                <div class="task-list">

                    <div class="task1 completed">
                        <input type="checkbox" checked >
                        <span>Plan the week</span>
                    </div>

                    <div class="task1 completed">
                        <input type="checkbox" checked>
                        <span>Style the login page</span>
                    </div>

                    <div class="task1">
                        <input type="checkbox" >
                        <span>Connect json-server</span>
                    </div>

                </div>
                <footer class="footer">
            Studio93 intern program
        </footer>

            </section>

        </main>
        
       

<div class="login-panel">

    <div class="login-card">

        <h2>Welcome back</h2>

        <p class="login-subtitle">
            Log in to see your tasks.
        </p>

        <form class="login-form " id="login-form">

            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        aria-label="Show password"
                    >
                        
                    </button>

                </div>
            </div>

            
            <button type="submit" class="login-button">
                Log in
            </button>

        </form>

        
        <p class="signup-text">
            New to TaskFlow?
            <a href="signup.html">Create an account</a>
        </p>

    </div>

</div>
</div>

<script src="script.js"></script>
</body>
</html>
